import io.papermc.hangarpublishplugin.model.Platforms

plugins {
    id "java"
    id "fabric-loom" version "1.13.6" apply false
    id "net.minecraftforge.gradle" version "[7.0.3,8)" apply false
    id "net.neoforged.moddev" version "2.0.148" apply false
    id "io.papermc.hangar-publish-plugin" version "0.1.4"
}

def minemoriesVersion = providers.gradleProperty("minemories_version").get()

allprojects {
    group = "dev.becerritoo.minemories"
    version = minemoriesVersion
}

subprojects {
    apply plugin: "java"

    repositories {
        mavenCentral()
        maven { url = "https://maven.fabricmc.net/" }
        maven { url = "https://repo.papermc.io/repository/maven-public/" }
    }

    java {
        toolchain.languageVersion = JavaLanguageVersion.of(21)
        withSourcesJar()
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = "UTF-8"
        options.release = 21
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }

    dependencies {
        testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.11.4"
    }
}

tasks.register("release", Copy) {
    dependsOn(":fabric:remapJar", ":forge:jar", ":neoforge:jar", ":paper:jar", "resourcePack")
    from(project(":fabric").layout.buildDirectory.dir("libs")) {
        include("minemories-fabric-${project.version}.jar")
    }
    from(project(":paper").layout.buildDirectory.dir("libs")) {
        include("minemories-paper-${project.version}.jar")
    }
    from(project(":forge").layout.buildDirectory.dir("libs")) {
        include("minemories-forge-${project.version}.jar")
    }
    from(project(":neoforge").layout.buildDirectory.dir("libs")) {
        include("minemories-neoforge-${project.version}.jar")
    }
    from(layout.buildDirectory.dir("distributions")) {
        include("minemories-resource-pack-${project.version}.zip")
    }
    into(layout.buildDirectory.dir("release"))
}

tasks.register("resourcePack", Zip) {
    from("resource-pack")
    archiveFileName = "minemories-resource-pack-${project.version}.zip"
    destinationDirectory = layout.buildDirectory.dir("distributions")
}

hangarPublish {
    publications.register("plugin") {
        version.set(project.version.toString())
        id.set("Minemories")
        channel.set("Release")
        changelog.set(providers.environmentVariable("HANGAR_CHANGELOG").orElse("See the GitHub release notes for Minemories ${project.version}."))
        apiKey.set(providers.environmentVariable("HANGAR_API_TOKEN"))

        platforms {
            register(Platforms.PAPER) {
                jar.set(project(":paper").tasks.named("jar", Jar).flatMap { it.archiveFile })
                platformVersions.set([providers.gradleProperty("minecraft_version").get()])
            }
        }
    }
}
