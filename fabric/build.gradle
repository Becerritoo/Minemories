plugins {
    id "fabric-loom"
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    implementation project(":common")
    include project(":common")
    testImplementation platform("org.junit:junit-bom:5.11.4")
    testImplementation "org.junit.jupiter:junit-jupiter"
}

sourceSets {
    main {
        java.srcDir(rootProject.file("client-common/src/main/java"))
        resources.srcDir(rootProject.file("client-common/src/main/resources"))
    }
    test {
        java.srcDir(rootProject.file("client-common/src/test/java"))
    }
}

processResources {
    inputs.property("version", project.version)
    inputs.property("minecraft_version", minecraft_version)
    from(rootProject.file("resource-pack")) {
        include("pack.mcmeta")
    }
    filesMatching("fabric.mod.json") {
        expand("version": project.version, "minecraft_version": minecraft_version)
    }
}

loom {
    runs {
        client {
            client()
            name = "Minemories Client"
            runDir = "run/client"
        }
    }
}

tasks.named("remapJar") {
    archiveFileName = "minemories-fabric-${project.version}.jar"
}
