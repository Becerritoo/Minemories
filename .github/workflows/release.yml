name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      - name: Validate tag
        run: |
          version="$(sed -n 's/^minemories_version=//p' gradle.properties)"
          test "$GITHUB_REF_NAME" = "v$version"
      - run: ./gradlew clean test release
      - name: Checksums
        run: cd build/release && sha256sum * > SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/release/* --verify-tag --generate-notes
