name: Publish Minemories to Modrinth

on:
  release:
    types: [published]
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      operation:
        description: Operation to perform
        required: true
        type: choice
        default: inspect
        options:
          - inspect
          - publish
      tag:
        description: Git tag to inspect or publish
        required: true
        type: string
      channel:
        description: Modrinth release channel
        required: true
        type: choice
        default: release
        options:
          - release
          - beta
          - alpha

permissions:
  contents: read

concurrency:
  group: modrinth-${{ github.event.release.tag_name || github.event.workflow_run.head_branch || inputs.tag }}
  cancel-in-progress: false

jobs:
  modrinth:
    if: github.repository == 'Becerritoo/Minemories' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    name: Publish or inspect Modrinth project
    runs-on: ubuntu-latest
    env:
      MODRINTH_PROJECT: minememories
      MODRINTH_API: https://api.modrinth.com/v2
      USER_AGENT: Becerritoo/Minemories-GitHub-Actions (https://github.com/Becerritoo/Minemories)

    steps:
      - name: Select release tag
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          WORKFLOW_RUN_TAG: ${{ github.event.workflow_run.head_branch }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_CHANNEL: ${{ inputs.channel }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
            tag="${RELEASE_TAG}"
            if [[ "${IS_PRERELEASE}" == "true" ]]; then
              channel="beta"
            else
              channel="release"
            fi
            operation="publish"
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_run" ]]; then
            tag="${WORKFLOW_RUN_TAG}"
            if [[ "${tag}" == *-* ]]; then
              channel="beta"
            else
              channel="release"
            fi
            operation="publish"
          else
            tag="${INPUT_TAG}"
            channel="${INPUT_CHANNEL}"
            operation="${{ inputs.operation }}"
          fi

          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: ${tag}" >&2
            exit 1
          fi

          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${tag#v}" >> "${GITHUB_OUTPUT}"
          echo "channel=${channel}" >> "${GITHUB_OUTPUT}"
          echo "operation=${operation}" >> "${GITHUB_OUTPUT}"

      - name: Check out release
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.tag }}

      - name: Validate project version
        env:
          EXPECTED_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          project_version="$(sed -n 's/^minemories_version=//p' gradle.properties)"
          if [[ "${project_version}" != "${EXPECTED_VERSION}" ]]; then
            echo "Tag version ${EXPECTED_VERSION} does not match gradle.properties (${project_version})." >&2
            exit 1
          fi

      - name: Inspect authenticated Modrinth project
        id: project
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          set -euo pipefail
          set +x

          if [[ -z "${MODRINTH_TOKEN}" ]]; then
            echo "The MODRINTH_TOKEN repository secret is not configured." >&2
            exit 1
          fi

          response="${RUNNER_TEMP}/modrinth-project.json"
          curl --fail-with-body --silent --show-error \
            --header "Authorization: ${MODRINTH_TOKEN}" \
            --header "User-Agent: ${USER_AGENT}" \
            "${MODRINTH_API}/project/${MODRINTH_PROJECT}" \
            --output "${response}"

          project_id="$(jq -r '.id' "${response}")"
          if [[ -z "${project_id}" || "${project_id}" == "null" ]]; then
            echo "Modrinth did not return a project ID." >&2
            exit 1
          fi

          echo "id=${project_id}" >> "${GITHUB_OUTPUT}"
          jq '{id, slug, title, description, status, requested_status, queued, approved, project_type, categories, additional_categories, loaders, game_versions, environment, license, versions, source_url, issues_url, icon_url}' "${response}"

      - name: Check for existing loader versions
        id: existing
        if: steps.release.outputs.operation == 'publish'
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          PROJECT_ID: ${{ steps.project.outputs.id }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          set +x

          response="${RUNNER_TEMP}/modrinth-versions.json"
          curl --fail-with-body --silent --show-error \
            --header "Authorization: ${MODRINTH_TOKEN}" \
            --header "User-Agent: ${USER_AGENT}" \
            "${MODRINTH_API}/project/${PROJECT_ID}/version" \
            --output "${response}"

          fabric_id="$(jq -r --arg version "${VERSION}" '.[] | select(.version_number == $version and (.loaders | index("fabric"))) | .id' "${response}" | head -n 1)"
          forge_version="${VERSION}+forge"
          forge_id="$(jq -r --arg version "${forge_version}" '.[] | select(.version_number == $version and (.loaders | index("forge"))) | .id' "${response}" | head -n 1)"
          neoforge_version="${VERSION}+neoforge"
          neoforge_id="$(jq -r --arg version "${neoforge_version}" '.[] | select(.version_number == $version and (.loaders | index("neoforge"))) | .id' "${response}" | head -n 1)"
          paper_version="${VERSION}+paper"
          paper_id="$(jq -r --arg version "${paper_version}" '.[] | select(.version_number == $version and (.loaders | index("paper"))) | .id' "${response}" | head -n 1)"

          if [[ -n "${fabric_id}" ]]; then
            echo "Fabric ${VERSION} already exists on Modrinth as ${fabric_id}; skipping its upload."
            echo "fabric_exists=true" >> "${GITHUB_OUTPUT}"
            echo "fabric_id=${fabric_id}" >> "${GITHUB_OUTPUT}"
          else
            echo "fabric_exists=false" >> "${GITHUB_OUTPUT}"
          fi

          if [[ -n "${forge_id}" ]]; then
            echo "Forge ${forge_version} already exists on Modrinth as ${forge_id}; skipping its upload."
            echo "forge_exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "forge_exists=false" >> "${GITHUB_OUTPUT}"
          fi

          if [[ -n "${neoforge_id}" ]]; then
            echo "NeoForge ${neoforge_version} already exists on Modrinth as ${neoforge_id}; skipping its upload."
            echo "neoforge_exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "neoforge_exists=false" >> "${GITHUB_OUTPUT}"
          fi

          if [[ -n "${paper_id}" ]]; then
            echo "Paper ${paper_version} already exists on Modrinth as ${paper_id}; skipping its upload."
            echo "paper_exists=true" >> "${GITHUB_OUTPUT}"
            echo "paper_id=${paper_id}" >> "${GITHUB_OUTPUT}"
          else
            echo "paper_exists=false" >> "${GITHUB_OUTPUT}"
          fi

          if [[ -n "${fabric_id}" && -n "${forge_id}" && -n "${neoforge_id}" && -n "${paper_id}" ]]; then
            echo "all_exist=true" >> "${GITHUB_OUTPUT}"
          else
            echo "all_exist=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Synchronize Modrinth project metadata
        if: steps.release.outputs.operation == 'publish'
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          PROJECT_ID: ${{ steps.project.outputs.id }}
        run: |
          set -euo pipefail
          set +x

          metadata_file="${RUNNER_TEMP}/modrinth-project-metadata.json"
          jq -n \
            --rawfile body README.md \
            '{
              title: "Minemories",
              description: "Capture Minecraft memories as Instax-style maps and share them directly to Discord.",
              body: $body,
              categories: ["social", "game-mechanics", "decoration"],
              additional_categories: ["utility"],
              license_id: "MIT",
              source_url: "https://github.com/Becerritoo/Minemories",
              issues_url: "https://github.com/Becerritoo/Minemories/issues"
            }' > "${metadata_file}"

          curl --fail-with-body --silent --show-error \
            --request PATCH \
            --header "Authorization: ${MODRINTH_TOKEN}" \
            --header "User-Agent: ${USER_AGENT}" \
            --header "Content-Type: application/json" \
            --data-binary "@${metadata_file}" \
            "${MODRINTH_API}/project/${PROJECT_ID}"

          echo "Synchronized Modrinth project metadata."

      - name: Set up Java
        if: steps.release.outputs.operation == 'publish' && steps.existing.outputs.all_exist != 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build and test all artifacts
        if: steps.release.outputs.operation == 'publish' && steps.existing.outputs.all_exist != 'true'
        run: ./gradlew test release --no-daemon

      - name: Prepare Modrinth metadata
        if: steps.release.outputs.operation == 'publish' && steps.existing.outputs.all_exist != 'true'
        env:
          PROJECT_ID: ${{ steps.project.outputs.id }}
          VERSION: ${{ steps.release.outputs.version }}
          CHANNEL: ${{ steps.release.outputs.channel }}
        run: |
          set -euo pipefail

          minecraft_version="$(sed -n 's/^minecraft_version=//p' gradle.properties)"
          changelog_file="${RUNNER_TEMP}/modrinth-changelog.md"
          fabric_metadata="${RUNNER_TEMP}/modrinth-fabric-version.json"
          forge_metadata="${RUNNER_TEMP}/modrinth-forge-version.json"
          neoforge_metadata="${RUNNER_TEMP}/modrinth-neoforge-version.json"
          paper_metadata="${RUNNER_TEMP}/modrinth-paper-version.json"

          awk -v version="${VERSION}" '
            $0 ~ "^## \\[" version "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > "${changelog_file}"

          if [[ ! -s "${changelog_file}" ]]; then
            echo "No changelog entry found for ${VERSION}." >&2
            exit 1
          fi

          jq -n \
            --arg name "Minemories ${VERSION}" \
            --arg version "${VERSION}" \
            --rawfile changelog "${changelog_file}" \
            --arg project_id "${PROJECT_ID}" \
            --arg minecraft_version "${minecraft_version}" \
            --arg version_type "${CHANNEL}" \
            '{
              name: $name,
              version_number: $version,
              changelog: $changelog,
              dependencies: [
                {project_id: "P7dR8mSH", dependency_type: "required"}
              ],
              game_versions: [$minecraft_version],
              version_type: $version_type,
              loaders: ["fabric"],
              featured: true,
              status: "listed",
              project_id: $project_id,
              file_parts: ["file"],
              primary_file: "file",
              environment: "client_only_server_optional"
            }' > "${fabric_metadata}"

          jq -n \
            --arg name "Minemories Forge ${VERSION}" \
            --arg version "${VERSION}+forge" \
            --rawfile changelog "${changelog_file}" \
            --arg project_id "${PROJECT_ID}" \
            --arg minecraft_version "${minecraft_version}" \
            --arg version_type "${CHANNEL}" \
            '{
              name: $name,
              version_number: $version,
              changelog: $changelog,
              dependencies: [],
              game_versions: [$minecraft_version],
              version_type: $version_type,
              loaders: ["forge"],
              featured: true,
              status: "listed",
              project_id: $project_id,
              file_parts: ["file"],
              primary_file: "file",
              environment: "client_only_server_optional"
            }' > "${forge_metadata}"

          jq -n \
            --arg name "Minemories NeoForge ${VERSION}" \
            --arg version "${VERSION}+neoforge" \
            --rawfile changelog "${changelog_file}" \
            --arg project_id "${PROJECT_ID}" \
            --arg minecraft_version "${minecraft_version}" \
            --arg version_type "${CHANNEL}" \
            '{
              name: $name,
              version_number: $version,
              changelog: $changelog,
              dependencies: [],
              game_versions: [$minecraft_version],
              version_type: $version_type,
              loaders: ["neoforge"],
              featured: true,
              status: "listed",
              project_id: $project_id,
              file_parts: ["file"],
              primary_file: "file",
              environment: "client_only_server_optional"
            }' > "${neoforge_metadata}"

          jq -n \
            --arg name "Minemories Paper ${VERSION}" \
            --arg version "${VERSION}+paper" \
            --rawfile changelog "${changelog_file}" \
            --arg project_id "${PROJECT_ID}" \
            --arg minecraft_version "${minecraft_version}" \
            --arg version_type "${CHANNEL}" \
            '{
              name: $name,
              version_number: $version,
              changelog: $changelog,
              dependencies: [],
              game_versions: [$minecraft_version],
              version_type: $version_type,
              loaders: ["paper"],
              featured: true,
              status: "listed",
              project_id: $project_id,
              file_parts: ["file"],
              primary_file: "file",
              environment: "server_only_client_optional"
            }' > "${paper_metadata}"

          jq . "${fabric_metadata}"
          jq . "${forge_metadata}"
          jq . "${neoforge_metadata}"
          jq . "${paper_metadata}"

      - name: Publish Fabric JAR to Modrinth
        id: publish_fabric
        if: steps.release.outputs.operation == 'publish' && steps.existing.outputs.fabric_exists != 'true'
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          set +x

          jar="fabric/build/libs/minemories-fabric-${VERSION}.jar"
          metadata_file="${RUNNER_TEMP}/modrinth-fabric-version.json"
          response="${RUNNER_TEMP}/modrinth-fabric-publish-response.json"

          test -f "${jar}"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: ${MODRINTH_TOKEN}" \
            --header "User-Agent: ${USER_AGENT}" \
            --form "data=<${metadata_file};type=application/json" \
            --form "file=@${jar};type=application/java-archive" \
            "${MODRINTH_API}/version" \
            --output "${response}"

          version_id="$(jq -r '.id' "${response}")"
          echo "id=${version_id}" >> "${GITHUB_OUTPUT}"
          echo "Published Minemories Fabric ${VERSION}: https://modrinth.com/project/${MODRINTH_PROJECT}/version/${version_id}"

      - name: Publish Forge JAR to Modrinth
        if: steps.release.outputs.operation == 'publish' && steps.existing.outputs.forge_exists != 'true'
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          set +x

          jar="forge/build/libs/minemories-forge-${VERSION}.jar"
          metadata_file="${RUNNER_TEMP}/modrinth-forge-version.json"
          response="${RUNNER_TEMP}/modrinth-forge-publish-response.json"

          test -f "${jar}"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: ${MODRINTH_TOKEN}" \
            --header "User-Agent: ${USER_AGENT}" \
            --form "data=<${metadata_file};type=application/json" \
            --form "file=@${jar};type=application/java-archive" \
            "${MODRINTH_API}/version" \
            --output "${response}"

          version_id="$(jq -r '.id' "${response}")"
          echo "Published Minemories Forge ${VERSION}: https://modrinth.com/project/${MODRINTH_PROJECT}/version/${version_id}"

      - name: Publish NeoForge JAR to Modrinth
        if: steps.release.outputs.operation == 'publish' && steps.existing.outputs.neoforge_exists != 'true'
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          set +x

          jar="neoforge/build/libs/minemories-neoforge-${VERSION}.jar"
          metadata_file="${RUNNER_TEMP}/modrinth-neoforge-version.json"
          response="${RUNNER_TEMP}/modrinth-neoforge-publish-response.json"

          test -f "${jar}"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: ${MODRINTH_TOKEN}" \
            --header "User-Agent: ${USER_AGENT}" \
            --form "data=<${metadata_file};type=application/json" \
            --form "file=@${jar};type=application/java-archive" \
            "${MODRINTH_API}/version" \
            --output "${response}"

          version_id="$(jq -r '.id' "${response}")"
          echo "Published Minemories NeoForge ${VERSION}: https://modrinth.com/project/${MODRINTH_PROJECT}/version/${version_id}"

      - name: Publish Paper JAR to Modrinth
        id: publish_paper
        if: steps.release.outputs.operation == 'publish' && steps.existing.outputs.paper_exists != 'true'
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          set +x

          jar="paper/build/libs/minemories-paper-${VERSION}.jar"
          metadata_file="${RUNNER_TEMP}/modrinth-paper-version.json"
          response="${RUNNER_TEMP}/modrinth-paper-publish-response.json"

          test -f "${jar}"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: ${MODRINTH_TOKEN}" \
            --header "User-Agent: ${USER_AGENT}" \
            --form "data=<${metadata_file};type=application/json" \
            --form "file=@${jar};type=application/java-archive" \
            "${MODRINTH_API}/version" \
            --output "${response}"

          version_id="$(jq -r '.id' "${response}")"
          echo "id=${version_id}" >> "${GITHUB_OUTPUT}"
          echo "Published Minemories Paper ${VERSION}: https://modrinth.com/project/${MODRINTH_PROJECT}/version/${version_id}"

      - name: Submit draft project for initial review
        if: steps.release.outputs.operation == 'publish'
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          PROJECT_ID: ${{ steps.project.outputs.id }}
        run: |
          set -euo pipefail
          set +x

          project_file="${RUNNER_TEMP}/modrinth-project-before-review.json"
          curl --fail-with-body --silent --show-error \
            --header "Authorization: ${MODRINTH_TOKEN}" \
            --header "User-Agent: ${USER_AGENT}" \
            "${MODRINTH_API}/project/${PROJECT_ID}" \
            --output "${project_file}"

          status="$(jq -r '.status' "${project_file}")"
          queued="$(jq -r '.queued // empty' "${project_file}")"
          if [[ "${status}" == "draft" && -z "${queued}" ]]; then
            payload="${RUNNER_TEMP}/modrinth-review-request.json"
            jq -n '{status: "processing"}' > "${payload}"
            curl --fail-with-body --silent --show-error \
              --request PATCH \
              --header "Authorization: ${MODRINTH_TOKEN}" \
              --header "User-Agent: ${USER_AGENT}" \
              --header "Content-Type: application/json" \
              --data-binary "@${payload}" \
              "${MODRINTH_API}/project/${PROJECT_ID}"
            echo "Submitted the Modrinth project for initial review."
          else
            echo "Modrinth review submission is not required (status=${status}, queued=${queued:-none})."
          fi

      - name: Report project moderation status
        if: steps.release.outputs.operation == 'publish'
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          PROJECT_ID: ${{ steps.project.outputs.id }}
        run: |
          set -euo pipefail
          set +x

          project_file="${RUNNER_TEMP}/modrinth-project-after-publish.json"
          curl --fail-with-body --silent --show-error \
            --header "Authorization: ${MODRINTH_TOKEN}" \
            --header "User-Agent: ${USER_AGENT}" \
            "${MODRINTH_API}/project/${PROJECT_ID}" \
            --output "${project_file}"

          status="$(jq -r '.status' "${project_file}")"
          queued="$(jq -r '.queued // empty' "${project_file}")"
          jq '{status, requested_status, queued, approved}' "${project_file}"
          if [[ "${status}" == "draft" && -z "${queued}" ]]; then
            echo "::warning::The initial version is uploaded, but the project must be submitted for review from its Modrinth page."
          fi
