name: Publish Minemories Paper to Hangar

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Stable Git tag to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: hangar-${{ github.event.workflow_run.head_branch || inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Becerritoo/Minemories' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Select release
        id: release
        env:
          WORKFLOW_RUN_TAG: ${{ github.event.workflow_run.head_branch }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_run" ]]; then
            tag="${WORKFLOW_RUN_TAG}"
            ref="${tag}"
          else
            tag="${INPUT_TAG}"
            ref="main"
          fi

          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Hangar only accepts stable release tags from this workflow: ${tag}" >&2
            exit 1
          fi

          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${tag#v}" >> "${GITHUB_OUTPUT}"
          echo "ref=${ref}" >> "${GITHUB_OUTPUT}"

      - name: Check out publication source
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.ref }}

      - name: Validate project version
        env:
          EXPECTED_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          project_version="$(sed -n 's/^minemories_version=//p' gradle.properties)"
          test "${project_version}" = "${EXPECTED_VERSION}"

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Load GitHub release notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          delimiter="HANGAR_CHANGELOG_$(date +%s)_${RANDOM}"
          {
            echo "HANGAR_CHANGELOG<<${delimiter}"
            gh release view "${RELEASE_TAG}" --json body --jq .body
            echo "${delimiter}"
          } >> "${GITHUB_ENV}"

      - name: Publish Paper JAR
        env:
          HANGAR_API_TOKEN: ${{ secrets.HANGAR_API_TOKEN }}
        run: ./gradlew :paper:check publishPluginPublicationToHangar --no-daemon --stacktrace
